project:
  type: default
  execute-dir: project
  render:
    - index.qmd
    - methods.qmd
    - rem.qmd
    - grd.qmd
    - version_01_initial.qmd
    - version_02_corpus.qmd
    - version_05_revision.qmd
    - version_06_expanded.qmd
    - version_07_editorial.qmd
    - version_10_panels.qmd

lang: en
jupyter: python3
date: today
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    embed-resources: true
    css: styles.css
    code-fold: true
    code-summary: "Show the code that produced this"
    code-tools: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    fig-cap-location: bottom
    number-sections: false
    smooth-scroll: true
execute:
  # echo: true is what makes the fold usable. With echo: false Quarto strips the code before
  # code-fold can wrap it, so every chunk rendered as a result with no way to see how it was made.
  echo: true
  error: false
  warning: false
  cache: false
  daemon: false
