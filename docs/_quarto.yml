project:
  type: book
  execute-dir: project
  output-dir: .

book:
  title: "Administrative recognition of autism in Chile"
  subtitle: "A multisource study of the public health and education records, 2019–2025"
  author: "Amaru Simón Agüero Jiménez"
  date: today
  search: true
  page-navigation: true
  reader-mode: true
  chapters:
    - index.qmd
    - part: "The study"
      chapters:
        - methods.qmd
        - results.qmd
    - part: "The sources in depth"
      chapters:
        - hospital.qmd
        - community.qmd
    - part: "Extended material"
      chapters:
        - tables.qmd
        - plates_core.qmd
        - plates_hospital.qmd
        - plates_community.qmd
        - plates_territory.qmd
        - plates_context.qmd
        - extended_tables.qmd
        - reproducibility.qmd
  sidebar:
    style: docked
    collapse-level: 2

lang: en
jupyter: python3
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    css: styles.css
    code-fold: true
    code-summary: "Show the code that produced this"
    code-tools: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    fig-cap-location: bottom
    smooth-scroll: true
    # embed-resources is deliberately OFF: with every figure inlined as base64 the chapters ran to
    # 9 MB each and every render wrote a fresh copy into git history. Shared assets now live in
    # site_libs/ and each chapter stays small.
execute:
  # echo: true is what makes the fold usable. With echo: false Quarto strips the code before
  # code-fold can wrap it, so every chunk rendered as a result with no way to see how it was made.
  echo: true
  error: false
  warning: false
  cache: false
  daemon: false
