project:
  type: default
  execute-dir: project
  render:
    - index.qmd
    - methods.qmd
    - rem.qmd
    - grd.qmd
    - lancet.qmd
    - lancet_supplement.qmd
    - lancet_corpus.qmd

lang: en
jupyter: python3
date: today
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-location: right
    embed-resources: true
    css: styles.css
    code-fold: true
    code-summary: "Show Python"
    fig-cap-location: bottom
    number-sections: false
    smooth-scroll: true
execute:
  echo: false
  error: false
  warning: false
  cache: false
  daemon: false
